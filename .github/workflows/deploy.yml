name: Microservices CI/CD

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: self-hosted

    permissions:
      packages: write
      contents: read

    steps:

      # -------------------------
      # Checkout Code
      # -------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # -------------------------
      # Login to GitHub Container Registry
      # -------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # -------------------------
      # Build Docker Images
      # -------------------------

      - name: Build User Service Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/user-service:latest ./user-service

      - name: Build Product Service Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/product-service:latest ./product-service

      - name: Build Frontend Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/frontend:latest ./frontend

      # -------------------------
      # Push Images to GHCR
      # -------------------------

      - name: Push User Service Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/user-service:latest

      - name: Push Product Service Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/product-service:latest

      - name: Push Frontend Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/frontend:latest

      # -------------------------
      # Stop Existing Containers
      # -------------------------

      - name: Stop Existing Containers
        run: docker compose down

      # -------------------------
      # Start Containers
      # -------------------------

      - name: Start Docker Compose Containers
        run: docker compose up -d

      # -------------------------
      # Verify Running Containers
      # -------------------------

      - name: Verify Running Containers
        run: docker ps
